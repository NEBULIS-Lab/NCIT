name: Validate and publish website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Check content and assets
        run: node scripts/check.mjs
      - name: Check types
        run: npm run typecheck
      - name: Package website
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Check whether Pages is configured
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_pages')
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo 'Website validated. To publish, enable Settings → Pages → GitHub Actions, then run this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.validate.outputs.pages_enabled == 'true' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
